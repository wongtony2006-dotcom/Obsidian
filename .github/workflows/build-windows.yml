name: Build Windows EXE

# Compile l'application en .exe sur une machine Windows, puis publie le
# fichier en « artifact » téléchargeable. Sur un tag « v* », crée en plus une
# Release GitHub et y attache l'exécutable (lien de téléchargement permanent).

on:
  push:
    branches:
      - "claude/keen-volta-iw62s7"
      - "main"
      - "master"
    tags:
      - "v*"
  workflow_dispatch: {}
  release:
    types: [created]

permissions:
  contents: write  # nécessaire pour créer la Release / téléverser l'exe

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compiler l'exécutable
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name AssistantCaptureClaude
          --collect-all anthropic
          --collect-all pydantic
          --hidden-import PIL._tkinter_finder
          app.py

      - name: Publier l'artifact (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: AssistantCaptureClaude-windows
          path: dist/AssistantCaptureClaude.exe
          if-no-files-found: error

      - name: Créer la Release et joindre l'exe (sur un tag v*)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          name: "Assistant Capture → Claude ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            Exécutable Windows autonome de l'assistant capture d'écran → Claude.

            Téléchargez **AssistantCaptureClaude.exe** ci-dessous, lancez-le,
            puis renseignez votre clé API Anthropic dans la fenêtre.

            Application normale et visible : aucun mécanisme de dissimulation
            ni de contournement de détection.
          files: dist/AssistantCaptureClaude.exe
