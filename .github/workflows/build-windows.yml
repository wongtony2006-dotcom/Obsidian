name: Build Clairvue (Windows EXE)

# Compile Clairvue en .exe sur une machine Windows, publie l'artifact
# téléchargeable, et (sur un tag v* ou un lancement manuel avec un tag) crée
# une Release GitHub avec l'exe joint — lien de téléchargement permanent.

on:
  push:
    branches:
      - "claude/keen-volta-iw62s7"
      - "main"
      - "master"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de la release à créer (ex. v1.1). Vide = seulement l'artifact."
        required: false
        default: ""
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Générer l'icône
        shell: bash
        run: python assets/make_icon.py || true

      - name: Compiler l'exécutable
        shell: bash
        run: |
          ICON_ARGS=""
          if [ -f assets/clairvue.ico ]; then
            ICON_ARGS="--icon assets/clairvue.ico --add-data assets/clairvue.ico;."
          fi
          pyinstaller --noconfirm --onefile --windowed \
            --name Clairvue $ICON_ARGS \
            --collect-all anthropic \
            --collect-all pydantic \
            --hidden-import PIL._tkinter_finder \
            app.py

      - name: Publier l'artifact (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Clairvue-windows
          path: dist/Clairvue.exe
          if-no-files-found: error

      - name: Déterminer le tag de release
        id: rel
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Créer la Release et joindre l'exe
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          name: "Clairvue ${{ steps.rel.outputs.tag }}"
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            **Clairvue — Assistant d'écran intelligent** (exécutable Windows autonome).

            Téléchargez **Clairvue.exe** ci-dessous, lancez-le, puis renseignez
            votre clé API Anthropic dans la fenêtre.

            Fonctionnalités : capture région/plein écran, modes (OCR, traduire,
            résumer, expliquer l'erreur/le code, pas à pas…), macros, historique,
            export Markdown, thème clair/sombre, raccourcis globaux.

            Application normale et visible : aucun mécanisme de dissimulation ni
            de contournement de détection (Alt+Tab, touche Windows, partage d'écran).
          files: dist/Clairvue.exe
