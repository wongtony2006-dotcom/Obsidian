name: Build Windows EXE

# Compile l'application en .exe sur une machine Windows, puis publie le
# fichier en « artifact » téléchargeable.
# Pour obtenir un lien de téléchargement PERMANENT, une Release GitHub est
# créée (avec l'exe joint) dans deux cas :
#   - push d'un tag « v* » ;
#   - lancement manuel (workflow_dispatch) en indiquant un tag de release.
# Dans ce dernier cas, c'est le runner GitHub qui crée le tag et la Release.

on:
  push:
    branches:
      - "claude/keen-volta-iw62s7"
      - "main"
      - "master"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de la release à créer (ex. v1.0). Laisser vide = pas de release, seulement l'artifact."
        required: false
        default: ""
  release:
    types: [created]

permissions:
  contents: write  # nécessaire pour créer le tag / la Release / téléverser l'exe

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compiler l'exécutable
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name AssistantCaptureClaude
          --collect-all anthropic
          --collect-all pydantic
          --hidden-import PIL._tkinter_finder
          app.py

      - name: Publier l'artifact (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: AssistantCaptureClaude-windows
          path: dist/AssistantCaptureClaude.exe
          if-no-files-found: error

      - name: Déterminer le tag de release
        id: rel
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Créer la Release et joindre l'exe
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          name: "Assistant Capture → Claude ${{ steps.rel.outputs.tag }}"
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            Exécutable Windows autonome de l'assistant capture d'écran → Claude.

            Téléchargez **AssistantCaptureClaude.exe** ci-dessous, lancez-le,
            puis renseignez votre clé API Anthropic dans la fenêtre.

            Application normale et visible : aucun mécanisme de dissimulation
            ni de contournement de détection (Alt+Tab, touche Windows, partage d'écran).
          files: dist/AssistantCaptureClaude.exe
